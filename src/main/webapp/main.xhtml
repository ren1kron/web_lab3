<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <f:loadBundle basename="messages" var="msg" />
    <title>#{msg['main.title']}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet library="webjars" name="primeflex/3.3.1/primeflex.min.css" />
    <h:outputStylesheet name="primeicons/primeicons.css" library="primefaces" />
    <link rel="stylesheet" href="css/styles.css" />
</h:head>

<h:body>

    <!-- Header -->
    <h:panelGroup layout="block" styleClass="header-container">
        <h1 class="header-title">#{msg['main.header']}</h1>
        <h1>#{msg['main.discipline']}</h1>
        <h2 class="author-info">#{msg['main.author']}</h2>
    </h:panelGroup>

    <!-- Main panel -->
    <div>
        <p:splitter>
            <p:splitterPanel styleClass="flex align-items-center justify-content-center">
                <h:form id="data-form">
                    <h6>#{msg['main.xLabel']}</h6>
                    <h:panelGrid>
                        <p:selectOneRadio id="x" value="#{formBean.x}" required="true" requiredMessage="X is required">
                            <f:selectItem itemLabel="-5" itemValue="#{-5}" />
                            <f:selectItem itemLabel="-4" itemValue="#{-4}" />
                            <f:selectItem itemLabel="-3" itemValue="#{-3}" />
                            <f:selectItem itemLabel="-2" itemValue="#{-2}" />
                            <f:selectItem itemLabel="-1" itemValue="#{-1}" />
                            <f:selectItem itemLabel="0" itemValue="#{0}" />
                            <f:selectItem itemLabel="1" itemValue="#{1}" />
                            <f:selectItem itemLabel="2" itemValue="#{2}" />
                            <f:selectItem itemLabel="3" itemValue="#{3}" />
                            <p:ajax update="graph-container" process="@this x" oncomplete="addSvgListener()" />
                        </p:selectOneRadio>
                    </h:panelGrid>

                    <!-- Поле Y: inputText -->
                    <div class="field col-12 md:col-4">
                        <h6>#{msg['main.yLabel']}</h6>
                        <p:inputText id="y" placeholder="#{msg['main.yPlaceholder']}" value="#{formBean.y}" required="true" requiredMessage="Y is required" validatorMessage="Y must be in [-3; 5]">
                            <f:validateDoubleRange minimum="-3" maximum="5"/>
                            <p:ajax event="input" update="graph-container" process="@this y" oncomplete="addSvgListener()" />
                        </p:inputText>
                    </div>

                    <!-- Поле R: slider -->
                    <h6>#{msg['main.rLabel']}</h6>
                    <h:outputText id="r-output" value="#{formBean.r}">
                        <f:convertNumber pattern="#0.00"/>
                    </h:outputText>
                    <h:inputHidden id="r" value="#{formBean.r}"/>
                    <p:slider for="r" display="r-output" minValue="2" maxValue="5" step="0.25" range="false" style="width:200px;" widgetVar="rSliderWidget">
                        <p:ajax event="slideEnd" update="graph-container" process="@this r" oncomplete="addSvgListener()" />
                    </p:slider>

                    <!-- Кнопка отправки формы -->
                    <p:commandButton icon="pi pi-check"
                                     id="btn_cfrm" value="#{msg['main.submit']}" action="#{formBean.submit(false)}" ajax="true"
                                     update="data-form result-table graph-container"
                                     styleClass="px-4 py-2"
                                     oncomplete="addSvgListener()"/>

                    <!-- Кнопка очистки формы -->
                    <p:commandButton icon="pi pi-trash"
                                     styleClass="px-4 py-2"
                                     id="btn_rst" value="#{msg['main.clear']}" action="#{formBean.clear()}" ajax="true"
                                     update="data-form result-table graph-container"
                                     process="@this"
                                     oncomplete="addSvgListener()"/>

                    <!-- Сообщения -->
                    <p:messages id="messages" showDetail="false" autoUpdate="true" />
                </h:form>
                <h:form id="hidden-form">
                    <h:inputHidden value="#{formBean.graph_x}" id="graph-x"/>
                    <h:inputHidden value="#{formBean.graph_y}" id="graph-y"/>
                    <h:inputHidden value="#{formBean.graph_r}" id="graph-r"/>
                    <p:commandButton id="graph-send"
                                     ajax="true"
                                     action="#{formBean.submit(true)}"
                                     process="@this graph-x graph-y graph-r"
                                     update="data-form result-table graph-container"
                                     oncomplete="addSvgListener()"
                                     style="display:none;"/>
                </h:form>
            </p:splitterPanel>
            <!-- Graph Panel -->
            <p:splitterPanel styleClass="flex align-items-center justify-content-center">
                <h:panelGroup id="graph-container">
                    <svg xmlns="http://www.w3.org/2000/svg" id="svg" width="500" height="500">
                        <!-- Графические элементы остаются без изменений -->
                        <polygon id="triangle"
                                 points="
                                    250,250
                                    250,#{250 + formBean.r * 40}
                                    #{250 - formBean.r * 40},250
                                 "
                                 fill="#122028" fill-opacity="0.6"/>
                        <rect id="rectangle"
                              x="250"
                              y="#{250 - formBean.r * 40}"
                              width="#{formBean.r * 40}"
                              height="#{formBean.r * 40}"
                              fill="#122028" fill-opacity="0.6"/>
                        <path id="quarterCircle"
                              d="
                                M 250 250
                                L #{250 - formBean.r * 40} 250
                                A #{formBean.r * 40} #{formBean.r * 40} 0 0 1 250 #{250 - formBean.r * 40}
                                Z"
                              fill="#122028" fill-opacity="0.6"/>
                        <line x1="0" y1="250" x2="500" y2="250" stroke="#122028"/>
                        <line x1="250" y1="0" x2="250" y2="500" stroke="#122028"/>
                        <!-- Остальные элементы разметки графика (подписи осей, разметка) остаются без изменений -->
                        <ui:repeat value="#{formBean.points}" var="point">
                            <circle cx="#{250 + point.x * 40}"
                                    cy="#{250 - point.y * 40}"
                                    r="3.5"
                                    fill="#{point.hit ? '#11FF00FF' : 'red'}"
                                    fill-opacity="0.9"
                                    stroke="#{point.hit ? 'green' : 'firebrick'}"/>
                        </ui:repeat>
                        <circle id="pointer" r="2.5" cx="#{250 + formBean.x * 40}" cy="#{250 - formBean.y * 40}"
                                fill-opacity="0.9" fill="blue" stroke="darkblue"/>
                    </svg>
                </h:panelGroup>
            </p:splitterPanel>
        </p:splitter>
    </div>

    <p:panel class="flex align-items-center justify-content-center">
        <p:button value="#{msg['main.returnHome']}" outcome="index.xhtml" />
    </p:panel>

    <p:dataTable id="result-table" value="#{formBean.points}" var="point"
                 scrollable="true" scrollHeight="250"
                 style="margin-top:20px">

        <p:column headerText="#{msg['main.table.header.x']}" sortable="true">
            <h:outputText value="#{point.x}" />
        </p:column>

        <p:column headerText="#{msg['main.table.header.y']}" sortable="true">
            <h:outputText value="#{point.y}" />
        </p:column>

        <p:column headerText="#{msg['main.table.header.r']}" sortable="true">
            <h:outputText value="#{point.r}" />
        </p:column>

        <p:column headerText="#{msg['main.table.header.hit']}" sortable="true">
            <h:outputText value="#{point.hit ? msg['main.table.hit.true'] : msg['main.table.hit.false']}" />
        </p:column>

        <p:column headerText="#{msg['main.table.header.time']}" sortable="true">
            <h:outputText value="#{point.hitTime}">
                <f:convertDateTime pattern="dd.MM.yyyy HH:mm:ss"/>
            </h:outputText>
        </p:column>

    </p:dataTable>

    <script type="text/javascript" src="js/fetch.js"></script>

</h:body>

</html>
